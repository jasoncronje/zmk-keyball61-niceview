# Switch the Touch ID board off 15 min after the last left-half key press
# (modules/touchid-power; the on-board TPS61023 boost's EN is on pm9, see the
# left overlay). The delay counts from ZMK's 30 s idle. Once off, the board
# only reconnects after its sensor is clicked, so keep this long. Plugging in
# USB switches it to always-on until unplugged; FUNCTION + T cycles auto/on/off.
CONFIG_KEYBALL61_TOUCHID_POWER=y
CONFIG_KEYBALL61_TOUCHID_OFF_DELAY_SEC=870

# Host Bluetooth interval, unit 1.25 ms. Fixed 12 = 15 ms, the one fixed interval
# Apple's accessory rules allow for a keyboard. The right half asks for 7.5 ms as
# a mouse; see its .conf.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
