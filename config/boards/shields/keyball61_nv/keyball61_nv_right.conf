CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

# --- PMW3610 Driver Configuration ---
CONFIG_PMW3610=y
# Default trackball sensitivity (CPI/DPI). Higher = faster.
# 400: 600 felt too fast once merged BLE reports arrived (bigger steps per
# report get more macOS acceleration).
# 800 here; zip_pointer_accel in the right overlay sets the gain, so set speed
# there, not here. Its speed-low/speed-high are in counts at this CPI: scale
# them with it if it changes.
CONFIG_PMW3610_CPI=800
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
# Scroll speed divisor. Higher = slower scrolling. Scaled with CPI (48 at 600, 32 at 400).
CONFIG_PMW3610_SCROLL_TICK=64
# Invert scroll direction.
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
# Enable smart algorithm for smoother movement.
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
# Polling rate: 250 Hz in the sensor (driver default, set explicitly). The sensor
# adds up movement between reads, so nothing is lost. At 125 Hz each 15 ms host
# slot got 1 or 2 readings (8 ms vs 15 ms), uneven steps that felt choppy; at
# 250 Hz it is 3 or 4 (evened out by CONFIG_ZMK_BLE_MOUSE_REPORT_RESAMPLE below). Without CONFIG_ZMK_BLE_MOUSE_REPORT_COALESCE
# (keyball61_nv.conf) 250 Hz queued ~4 reports per slot, more than the link
# sends, and the pointer trailed the ball; with it they are merged into one.
# Not PMW3610_POLLING_RATE_125_SW: it holds each reading and drops it unless
# another arrives within 128 ms, so slow and soft rolls lost most of their movement.
CONFIG_PMW3610_POLLING_RATE_250=y

# --- Host link: advertise as a mouse so macOS grants 7.5 ms ---
# macOS's bluetoothd picks the host interval from the Bluetooth appearance. A
# keyboard (961, 0x03C1, ZMK's default) is held at 15 ms ("Compatible LE HID") and
# any faster request is refused, which is why fixed 7.5 and 11.25 ms were ignored.
# A mouse (962, 0x03C2) "needs low latency" and gets 7.5 ms, like the MX Ergo
# (bluetoothd logs, 2026-11-17). That doubles pointer updates to 133/s on a 120 Hz
# screen. The HID descriptor is unchanged, so typing works as before. Needs the
# ZMK fork's ble.c, which advertises this value instead of a hard-coded keyboard.
# After flashing: forget Keyball61 on the Mac, clear the profile's bond, re-pair.
CONFIG_BT_DEVICE_APPEARANCE=962
# Interval unit: 1.25 ms. 6-9 = 7.5-11.25 ms, the range the MX Ergo asks for and
# macOS accepts. Latency and timeout are in keyball61_*.conf.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# Give every mouse report the same slice of time: a 4 ms sensor on a 7.5 ms link
# would otherwise alternate 2 and 1 readings per report (3 and 4 at 15 ms), and
# macOS accelerates each report by its own counts, so uneven reports read as
# stutter. Adds 4 ms of latency. The sample period must match the polling rate.
CONFIG_ZMK_BLE_MOUSE_REPORT_RESAMPLE=y
CONFIG_ZMK_BLE_MOUSE_REPORT_RESAMPLE_SAMPLE_US=4000

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Fn+G (&out OUT_TOG) to USB with a cable plugged in: drop every host Bluetooth
# connection and stop advertising. The split link to the left half stays up.
# Back to BLE, or unplugging the cable, starts advertising again (fork patch).
CONFIG_ZMK_BLE_HOST_OFF_ON_USB=y
